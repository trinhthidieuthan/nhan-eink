<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vy Viên yêu thương</title>
<link rel="manifest" href="dua-sao.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="dua-sao-192.png">
<link rel="apple-touch-icon" href="dua-sao-192.png">
<style>
  /* Thiết kế cho màn e-ink: nền trắng, viền đen, không bóng đổ, không hiệu ứng */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;background:#fff;color:#000}
  body{font:16px/1.4 -apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif}
  .app{max-width:1100px;margin:0 auto;padding:10px 12px 12px}
  button{font:inherit;color:#000;background:#fff;border:2px solid #000;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
  button:active{background:#000;color:#fff}
  button.solid{background:#000;color:#fff}
  button.ghost{border-color:#999}
  button:disabled{border-color:#bbb;color:#999;background:#fff}
  input,select,textarea{font:inherit;color:#000;background:#fff;border:2px solid #000;border-radius:8px;padding:8px 10px;min-height:44px;width:100%}
  textarea{min-height:110px}
  .muted{color:#555}.small{font-size:13px}

  /* Thanh trên */
  .top{display:flex;align-items:center;flex-wrap:wrap;row-gap:4px;gap:10px;border:2px solid #000;border-radius:12px 12px 0 0;padding:8px 12px}
  .top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  .top .date{font-weight:700;white-space:nowrap}
  .top .sp{flex:1}
  .top .sync{font-size:12px;color:#555;white-space:nowrap}
  .top button{min-height:40px;padding:4px 10px}

  /* Đường đua */
  .race{border:2px solid #000;border-top:0;padding:8px 12px 6px}
  .lane{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;margin:6px 0}
  .lane .who b{display:block;font-size:15px}.lane .who span{font-size:12px;color:#444}
  .track{position:relative;height:34px;border:2px solid #000;border-radius:18px;background:repeating-linear-gradient(90deg,transparent 0 12px,#bbb 12px 13px)}
  .track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:16px;background:repeating-linear-gradient(45deg,#000 0 3px,#fff 3px 7px);opacity:.35}
  .track .runner{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid #000;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px}
  .flag{width:34px;height:34px;display:grid;place-items:center;font-size:24px;line-height:1;border:2px dashed #000;border-radius:50%}
  .flag.won{border-style:solid;border-width:3px;background:#000}
  .cheer{text-align:center;font-style:italic;font-size:14px;margin:4px 0 0}

  /* Nội dung */
  .main{border:2px solid #000;border-top:0;min-height:300px}
  .cols{display:grid;grid-template-columns:1fr 1fr}
  .col{padding:10px 12px;min-width:0}
  .col+.col{border-left:2px solid #000}
  @media (max-width:560px){.col{padding:8px}.task{gap:8px}.task .t{font-size:15px}.box{flex-basis:28px;height:28px}.khead{flex-wrap:wrap}.khead .sub{display:none}.chip{font-size:11px;padding:0 5px}.shared{grid-template-columns:1fr}}
  @media (max-width:400px){.cols{grid-template-columns:1fr}.col+.col{border-left:0;border-top:2px solid #000}}
  .khead{display:flex;align-items:center;gap:8px;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:6px}
  .khead .ic{font-size:20px}.khead b{font-size:18px}.khead .sub{font-size:12px;color:#555;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-block;border:2px solid #000;border-radius:999px;padding:0 8px;font-size:13px;font-weight:700;white-space:nowrap}
  .pill.inv{background:#000;color:#fff}
  .task{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed #999;cursor:pointer;user-select:none}
  .task:last-child{border-bottom:0}
  .box{flex:0 0 32px;height:32px;border:2.5px solid #000;border-radius:7px;display:grid;place-items:center;font-size:20px;font-weight:900;line-height:1}
  .task.done .box{background:#000;color:#fff}
  .task .t{font-size:17px;font-weight:600}
  .task.done .t{text-decoration:line-through;color:#555;font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .chip{border:1.5px solid #000;border-radius:999px;padding:0 7px;font-size:12px;white-space:nowrap}
  .chip.b{font-weight:800}
  .empty{color:#666;text-align:center;padding:24px 8px;font-style:italic}
  .shared{border-top:2px solid #000;padding:8px 12px;display:grid;grid-template-columns:110px 1fr;gap:10px}
  .shared .lbl b{display:block}.shared .lbl span{font-size:12px;color:#555}
  .seg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #000}
  .seg button{min-height:36px;padding:2px 12px;font-size:14px}
  .seg button.on{background:#000;color:#fff}
  .sess{font-weight:800;font-size:14px;letter-spacing:.5px;margin:10px 0 2px;border-bottom:2px solid #000;display:inline-block}

  /* Bảng sao */
  .card{border:2px solid #000;border-radius:14px;padding:12px;margin:10px}
  .hero{display:flex;gap:12px;align-items:center}
  .avatar{width:64px;height:64px;border:2px solid #000;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:0 0 64px}
  .hero b{font-size:24px;display:block}.hero span{color:#555}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .stat{border:2px solid #000;border-radius:10px;text-align:center;padding:8px 4px}
  .stat b{font-size:24px;display:block}.stat span{font-size:12px}
  .hist{list-style:none;margin:0;padding:0;font-size:14px}
  .hist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #999;padding:5px 0}
  .hist li b{white-space:nowrap}

  /* Tuần */
  table.week{width:100%;border-collapse:collapse;font-size:14px}
  .week th,.week td{border:1px solid #000;padding:6px 4px;text-align:center}
  .week th.today,.week td.today{border-width:3px}
  .week td.full{background:#000;color:#fff;font-weight:800}

  /* Đổi quà */
  .rw{display:flex;gap:10px;align-items:center;border-bottom:1px dashed #999;padding:10px 0;flex-wrap:wrap}
  .rw .n{flex:1;min-width:140px;font-size:17px;font-weight:600}
  .rw .c{font-weight:800;white-space:nowrap}

  /* Thanh tab dưới */
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);border:2px solid #000;border-radius:12px;overflow:hidden;position:sticky;bottom:6px;background:#fff;z-index:5;margin-top:-2px}
  .tabs button{border:0;border-radius:0;border-left:1px solid #000;min-height:52px;font-size:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
  .tabs button:first-child{border-left:0}
  .tabs button .i{font-size:17px}
  .tabs button.on{background:#000;color:#fff}
  @media (max-width:520px){.tabs button{font-size:11px}.top h1{font-size:15px}.top .sync{display:none}.lane{grid-template-columns:64px 1fr 30px}}

  /* Màn hình nghỉ: bảng treo tường toàn màn, chữ lớn */
  .restbtn{min-height:38px;padding:2px 10px;font-size:14px;white-space:nowrap;margin-left:auto}
  #rest{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;padding:14px 16px 10px;overflow:hidden}
  #rest .rh{display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid #000;padding-bottom:8px}
  #rest .clock{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-1px}
  #rest .day{flex:1;min-width:0}
  #rest .day b{display:block;font-size:24px;line-height:1.1}
  #rest .day span{font-size:16px;color:#333}
  #rest .x{position:absolute;top:8px;right:8px;min-height:34px;padding:0 10px;font-size:13px;border-color:#999;color:#555}
  #rest .race{border:0;padding:8px 0 2px}
  #rest .lane{grid-template-columns:96px 1fr 38px}
  #rest .lane .who b{font-size:20px}.lane .who span{font-size:13px}
  #rest .track{height:40px}#rest .track .runner{width:40px;height:40px;margin:-20px 0 0 -20px;font-size:22px}#rest .flag{width:40px;height:40px;font-size:28px}
  #rest .cheer{font-size:17px;margin:2px 0 6px}
  #rest .rcols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid #000}
  #rest .rcol{padding:8px 10px;min-width:0;overflow:hidden;display:flex;flex-direction:column}
  #rest .rcol+.rcol{border-left:2px solid #000}
  #rest .rk{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  #rest .rk .ic{font-size:30px}#rest .rk b{font-size:24px;flex:1}
  #rest .rk .pill{font-size:15px}
  #rest .rt{display:flex;gap:10px;align-items:flex-start;padding:calc(var(--fs,20px)*.35) 0;border-bottom:1px dashed #999;font-size:var(--fs,20px);line-height:1.25;font-weight:600;cursor:pointer}
  #rest .rt .box{flex:0 0 calc(var(--fs,20px)*1.4);height:calc(var(--fs,20px)*1.4);font-size:calc(var(--fs,20px)*.95)}
  #rest .rt.done{color:#666;font-weight:400}#rest .rt.done span{text-decoration:line-through}#rest .rt.done .box{background:#000;color:#fff}
  #rest .more{font-size:15px;color:#444;padding-top:6px}
  #rest .allok{flex:1;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:700}
  #rest .rf{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#444;border-top:1px solid #000;padding-top:6px;margin-top:4px}
  @media (orientation:portrait){#rest .rt{gap:8px}#rest .rk b{font-size:20px}#rest .rk .ic{font-size:24px}#rest .rk{flex-wrap:wrap;gap:4px 6px}#rest .rcol{padding:8px 8px}}
  @media (max-width:520px){#rest .clock{font-size:52px}#rest .rt{font-size:18px}}

  /* Cài đặt */
  .set{padding:12px}
  .set h3{margin:18px 0 8px;font-size:17px;border-bottom:2px solid #000;padding-bottom:4px}
  .set h3:first-child{margin-top:4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row > *{flex:1;min-width:120px}
  .item{border:1.5px solid #000;border-radius:10px;padding:10px;margin:8px 0}
  .item .row{margin-top:6px}
  label.f{display:block;font-size:13px;color:#333}
  label.f > input,label.f > select{margin-top:2px}
  .daypick{display:flex;gap:4px;flex-wrap:wrap}
  .daypick label{border:1.5px solid #000;border-radius:8px;padding:4px 8px;font-size:13px;display:flex;gap:4px;align-items:center}
  .daypick input{width:auto;min-height:0}
  .bar-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .note{font-size:13px;border-left:3px solid #000;padding-left:8px;color:#333}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>🏁 VY VIÊN YÊU THƯƠNG</h1><span class="date" id="date"></span>
    <span class="sp"></span><span class="sync" id="sync"></span>
    <button class="restbtn" id="restBtn" title="Màn hình nghỉ toàn màn hình">⛶ Màn hình nghỉ</button>
  </div>
  <div class="race" id="race"></div>
  <div class="main" id="main"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="rest" hidden></div>

<script>
'use strict';
/* ================= Dữ liệu ================= */
const KEY='dua-sao-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const SESS={sang:'Sáng',trua:'Trưa',chieu:'Chiều',toi:'Tối',ca:'Cả ngày'};
const WD=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'],WS=['CN','T2','T3','T4','T5','T6','T7'];
const ICONS=['🐶','🐭','🐹','🐝','🐻','🐰','🦊','🐼','🐱','🐶','🦄','🐥','🐴','🐬','🦁','🐢','🌟'];
function defaults(){
  return {
    kids:[{id:'k1',name:'Lam Vy',sub:'Cún con chăm chỉ',icon:'🐶'},{id:'k2',name:'Lam Viên',sub:'Chuột con lanh lợi',icon:'🐭'}],
    tasks:[
      {id:uid(),title:'Đánh răng, rửa mặt',who:'both',session:'sang',stars:1,prio:false,deadline:'',days:[0,1,2,3,4,5,6]},
      {id:uid(),title:'Uống hết cốc sữa',who:'both',session:'sang',stars:1,prio:false,deadline:'',days:[0,1,2,3,4,5,6]},
      {id:uid(),title:'Ngủ trưa đúng giờ',who:'both',session:'trua',stars:1,prio:false,deadline:'',days:[0,1,2,3,4,5,6]},
      {id:uid(),title:'Đọc sách 15 phút',who:'both',session:'chieu',stars:2,prio:false,deadline:'',days:[0,1,2,3,4,5,6]},
      {id:uid(),title:'Xếp sách vở cho ngày mai',who:'both',session:'toi',stars:2,prio:true,deadline:'21:00',days:[0,1,2,3,4]},
      {id:uid(),title:'Tưới cây ngoài ban công',who:'shared',session:'chieu',stars:1,prio:false,deadline:'',days:[0,1,2,3,4,5,6]},
    ],
    rewards:[{id:uid(),title:'30 phút xem hoạt hình',cost:10},{id:uid(),title:'Được chọn món ăn tối',cost:15},{id:uid(),title:'Đi công viên cuối tuần',cost:30},{id:uid(),title:'Một món đồ chơi nhỏ',cost:50}],
    rules:['Làm xong việc thì tự đánh dấu, bố mẹ sẽ kiểm tra.','Mỗi việc xong được cộng số sao ghi bên cạnh.','Hoàn thành hết việc trong ngày để giữ chuỗi ngày liên tiếp.','Muốn đổi quà thì nhờ bố mẹ xác nhận.','Anh chị em giúp nhau thì cả hai cùng vui!'],
    pin:'',done:{},stars:{k1:0,k2:0},log:[]
  };
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaults();}catch(_){S=defaults();}
/* Cập nhật hình đại diện mặc định cho máy đã mở bản cũ (chỉ khi chưa tự đổi) */
if(!S.v2){const k1=S.kids.find(k=>k.id==='k1'),k2=S.kids.find(k=>k.id==='k2');
  if(k1&&k1.icon==='🐝'){k1.icon='🐶';if(k1.sub==='Ong nhỏ chăm chỉ')k1.sub='Cún con chăm chỉ';}
  if(k2&&k2.icon==='🐻'){k2.icon='🐭';if(k2.sub==='Gấu con dũng cảm')k2.sub='Chuột con lanh lợi';}S.v2=true;}
/* Bản 3: tên đầy đủ Lam Vy / Lam Viên (chỉ khi vẫn là tên mặc định cũ) */
if(!S.v3){for(const [id,old,nw] of [['k1','Vy','Lam Vy'],['k2','Viên','Lam Viên']]){const k=S.kids.find(x=>x.id===id);if(k&&k.name===old)k.name=nw;}S.v3=true;}
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}syncPush();}

/* ================= Đồng bộ giữa các máy (Firebase Realtime Database của gia đình) =================
   - Mỗi gia đình một “mã gia đình” dài, ngẫu nhiên; dữ liệu nằm ở /families/<mã>/state.
   - Máy nào thay đổi thì đẩy lên; máy khác nhận ngay (bản mới hơn thắng).
   - Cấu hình chỉ lưu trên từng máy, không nằm trong dữ liệu đồng bộ.                                  */
const SYNC_KEY='dua-sao-sync',FB='https://www.gstatic.com/firebasejs/10.12.2/';
let SY={cfg:null,code:'',on:false,joined:false};try{Object.assign(SY,JSON.parse(localStorage.getItem(SYNC_KEY))||{});}catch(_){}
const syncRT={ref:null,set:null,status:'',lastAt:0,timer:0,applying:false};
function syncSaveCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify({cfg:SY.cfg,code:SY.code,on:SY.on,joined:SY.joined}));}catch(_){}}
function newFamilyCode(){const a='abcdefghjkmnpqrstuvwxyz23456789',r=crypto.getRandomValues(new Uint8Array(20));return [...r].map(x=>a[x%a.length]).join('');}
function parseFirebaseConfig(text,dbUrl){
  const src=String(text).replace(/(^|[^:"'\w])\/\/[^\n]*/g,'$1'); // bỏ dòng ghi chú, giữ nguyên https://
  const m=src.match(/\{[\s\S]*\}/);if(!m)throw Error('Chưa thấy đoạn firebaseConfig = { … }.');
  const json=m[0].replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');
  let c;try{c=JSON.parse(json);}catch(_){throw Error('Không đọc được đoạn cấu hình. Hãy dán nguyên khối firebaseConfig.');}
  if(dbUrl)c.databaseURL=dbUrl.trim();
  if(!c.apiKey||!c.projectId)throw Error('Thiếu apiKey hoặc projectId.');
  if(!c.databaseURL)throw Error('Thiếu địa chỉ Realtime Database (databaseURL). Dán thêm vào ô bên dưới.');
  return {apiKey:c.apiKey,authDomain:c.authDomain,databaseURL:c.databaseURL,projectId:c.projectId,appId:c.appId};
}
function syncShareLink(){const p=btoa(unescape(encodeURIComponent(JSON.stringify({c:SY.cfg,k:SY.code})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin+location.pathname+'#dongbo='+p;}
function syncSetStatus(s){syncRT.status=s;const el=$('syncState');if(el)el.textContent=s;renderTop();}
async function syncStart(){
  if(!SY.cfg||!SY.code)return;
  try{
    syncSetStatus('Đang kết nối đồng bộ…');
    const [fa,fu,fd]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-database.js')]);
    const app=fa.getApps().find(a=>a.name==='vyvien')||fa.initializeApp(SY.cfg,'vyvien');
    await fu.signInAnonymously(fu.getAuth(app));
    const db=fd.getDatabase(app),r=fd.ref(db,'families/'+SY.code+'/state');
    syncRT.ref=r;syncRT.set=v=>fd.set(r,v);SY.on=true;syncSaveCfg();
    fd.onValue(r,snap=>syncOnRemote(snap.val()),err=>syncSetStatus('Lỗi đồng bộ: '+(err.message||err)));
  }catch(e){syncSetStatus('Chưa đồng bộ được: '+(e.code||e.message||e));}
}
function syncOnRemote(v){ // dữ liệu từ máy khác tới
  syncRT.lastAt=Date.now();
  if(!v){if(!SY.joined){SY.joined=true;syncSaveCfg();}syncPush(true);syncSetStatus('Đồng bộ ✓ (máy đầu tiên)');return;}
  let remote;try{remote=JSON.parse(v.json);}catch(_){return;}
  if(!remote||!remote.kids||!remote.tasks)return;
  const first=!SY.joined;
  if(first||(remote.savedAt||0)>(S.savedAt||0)){
    if(first){try{localStorage.setItem(KEY+'-truoc-dong-bo',JSON.stringify(S));}catch(_){}} // giữ bản cũ của máy này phòng khi cần
    syncRT.applying=true;S=remote;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}syncRT.applying=false;
    SY.joined=true;syncSaveCfg();render();
  }
  syncSetStatus('Đồng bộ ✓ '+pad(new Date().getHours())+':'+pad(new Date().getMinutes()));
}
function syncPush(now){
  if(!SY.on||!syncRT.set||syncRT.applying||(!SY.joined&&!now))return;
  clearTimeout(syncRT.timer);syncRT.timer=setTimeout(()=>{syncRT.set({json:JSON.stringify(S),at:S.savedAt||Date.now()}).catch(e=>syncSetStatus('Chưa gửi được: '+(e.code||e.message)));},now?0:400);
}
function syncStop(){SY.on=false;SY.joined=false;syncSaveCfg();syncSetStatus('Đã tắt đồng bộ');location.reload();}
/* Mở link chia sẻ (#dongbo=…) trên máy khác: tự nhận cấu hình */
(function(){const m=location.hash.match(/dongbo=([\w-]+)/);if(!m)return;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(o.c&&o.k){SY.cfg=o.c;SY.code=o.k;SY.on=true;SY.joined=false;syncSaveCfg();}}catch(_){}
  history.replaceState(null,'',location.pathname+location.search);})();

/* ================= Tiện ích ngày ================= */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function weekStart(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kid=id=>S.kids.find(k=>k.id===id);

/* Việc của một bé trong một ngày: việc riêng (who=kidId), việc cả hai (both) */
function tasksFor(kidId,d){const w=d.getDay();return S.tasks.filter(t=>(t.who===kidId||t.who==='both')&&t.days.includes(w));}
function sharedFor(d){const w=d.getDay();return S.tasks.filter(t=>t.who==='shared'&&t.days.includes(w));}
const isDone=(d,tid,kidId)=>!!(S.done[dkey(d)]||{})[tid+'|'+kidId];
function progress(kidId,d){const list=tasksFor(kidId,d),sh=sharedFor(d);const total=list.length+sh.length;
  const done=list.filter(t=>isDone(d,t.id,kidId)).length+sh.filter(t=>isDone(d,t.id,'shared')).length;return {done,total,pct:total?Math.round(done/total*100):0};}
function streak(kidId){let d=today(),n=0;const p0=progress(kidId,d);if(!(p0.total&&p0.done===p0.total))d=addDays(d,-1);
  for(let i=0;i<366;i++){const p=progress(kidId,d);if(!p.total){d=addDays(d,-1);continue;}if(p.done<p.total)break;n++;d=addDays(d,-1);}return n;}
function weekStars(kidId){const ws=weekStart(today()).getTime();return S.log.filter(e=>e.kid===kidId&&e.t>=ws&&e.type!=='buy').reduce((s,e)=>s+e.delta,0);}
function addLog(kidId,delta,reason,type){S.log.unshift({t:Date.now(),kid:kidId,delta,reason,type});if(S.log.length>400)S.log.length=400;}

function toggle(tid,kidId){
  const d=today(),k=dkey(d),t=S.tasks.find(x=>x.id===tid);if(!t)return;S.done[k]=S.done[k]||{};const key=tid+'|'+kidId,now=!S.done[k][key];
  if(now)S.done[k][key]=true;else delete S.done[k][key];
  const who=kidId==='shared'?S.kids.map(x=>x.id):[kidId];
  for(const w of who){S.stars[w]=(S.stars[w]||0)+(now?t.stars:-t.stars);addLog(w,now?t.stars:-t.stars,(now?'':'Bỏ đánh dấu: ')+t.title,'task');}
  save();render();
}

let tab='today',filter='all',parentOK=false;
const TABS=[['today','☀','Hôm nay'],['week','▦','Tuần'],['board','🏆','Bảng sao'],['shop','🎁','Đổi quà'],['rules','📜','Quy định'],['set','⚙','Cài đặt']];
function chips(t){const c=[];if(t.prio)c.push('<span class="chip b">★ Ưu tiên</span>');if(t.deadline)c.push(`<span class="chip">Trước ${esc(t.deadline)}</span>`);
  c.push(`<span class="chip">★×${t.stars}</span>`);if(t.session!=='ca')c.push(`<span class="chip">${SESS[t.session]}</span>`);return `<div class="chips">${c.join('')}</div>`;}
function taskRow(t,kidId,d){const dn=isDone(d,t.id,kidId);return `<div class="task${dn?' done':''}" data-t="${t.id}" data-k="${kidId}"><div class="box">${dn?'✓':''}</div><div><div class="t">${esc(t.title)}</div>${chips(t)}</div></div>`;}
const ORDER={sang:0,trua:1,chieu:2,toi:3,ca:4};
function sortT(list){return [...list].sort((a,b)=>(b.prio-a.prio)||(ORDER[a.session]-ORDER[b.session])||(a.deadline||'99').localeCompare(b.deadline||'99'));}

function renderTop(){const d=new Date();$('date').textContent=`· ${WD[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
  $('sync').textContent=SY.on&&syncRT.status?syncRT.status:(S.savedAt?`Lưu lúc ${pad(new Date(S.savedAt).getHours())}:${pad(new Date(S.savedAt).getMinutes())}`:'');}
function renderRace(){$('race').innerHTML=raceHTML();}
function raceHTML(){
  const d=today(),ps=S.kids.map(k=>({k,...progress(k.id,d)}));
  let html=ps.map(p=>`<div class="lane"><div class="who"><b>${esc(p.k.name)}</b><span>${p.done}/${p.total} · ${p.pct}%</span></div>
    <div class="track"><div class="fill" style="width:${p.pct}%"></div><div class="runner" style="left:calc(17px + (100% - 34px) * ${p.pct/100})">${p.k.icon}</div></div><div class="flag${p.total&&p.pct===100?' won':''}" title="Đích">🏆</div></div>`).join('');
  const [a,b]=ps;let msg;
  if(!a.total&&!b.total)msg='Hôm nay chưa có nhiệm vụ nào.';
  else if(a.pct===100&&b.pct===100)msg='Cả hai đã về đích! Tuyệt vời quá! 🎉';
  else if(a.pct===100||b.pct===100){const w=a.pct===100?a:b,o=w===a?b:a;msg=`${w.k.name} đã về đích! ${o.k.name} ơi, cố lên nào!`;}
  else if(a.pct===b.pct)msg=a.pct===0?'Tỉ số đang hòa! Ai sẽ xuất phát trước đây?':'Hai bạn đang ngang tài ngang sức!';
  else{const w=a.pct>b.pct?a:b,o=w===a?b:a;msg=`${w.k.name} đang dẫn trước — ${o.k.name} đuổi theo nhé!`;}
  return html+`<p class="cheer">“${esc(msg)}”</p>`;
}
function renderToday(){
  const d=today(),sh=sortT(sharedFor(d));
  const seg=`<div class="seg">${[['all','Tất cả'],['sang','Sáng'],['trua','Trưa'],['chieu','Chiều'],['toi','Tối']].map(([v,n])=>`<button data-f="${v}" class="${filter===v?'on':''}">${n}</button>`).join('')}</div>`;
  const pass=t=>filter==='all'||t.session===filter||t.session==='ca';
  const cols=S.kids.map(k=>{const p=progress(k.id,d),list=sortT(tasksFor(k.id,d)).filter(pass);
    let body='';if(filter==='all'){for(const s of ['sang','trua','chieu','toi','ca']){const g=list.filter(t=>t.session===s);if(g.length)body+=`<div class="sess">${SESS[s].toUpperCase()}</div>`+g.map(t=>taskRow(t,k.id,d)).join('');}}
    else body=list.map(t=>taskRow(t,k.id,d)).join('');
    return `<div class="col"><div class="khead"><span class="ic">${k.icon}</span><b>${esc(k.name)}</b><span class="sub">· ${esc(k.sub)}</span><span class="pill inv">${p.done}/${p.total} việc</span><span class="pill">★ ${S.stars[k.id]||0}</span></div>${body||'<div class="empty">Không có việc ở buổi này.</div>'}</div>`;}).join('');
  const shList=sh.filter(pass);
  return seg+`<div class="cols">${cols}</div><div class="shared"><div class="lbl"><b>🏠 Việc chung</b><span>Làm cùng nhau, cả hai được sao</span></div><div>${shList.length?shList.map(t=>taskRow(t,'shared',d)).join(''):'<div class="muted small" style="padding:10px 0">Hôm nay không có việc chung.</div>'}</div></div>`;
}
function renderWeek(){
  const ws=weekStart(today()),days=[...Array(7)].map((_,i)=>addDays(ws,i)),tk=dkey(today());
  const head=days.map(d=>`<th class="${dkey(d)===tk?'today':''}">${WS[d.getDay()]}<br><span class="small">${d.getDate()}/${d.getMonth()+1}</span></th>`).join('');
  const rows=S.kids.map(k=>`<tr><th>${k.icon} ${esc(k.name)}</th>${days.map(d=>{const p=progress(k.id,d),fut=d>today();
    return `<td class="${dkey(d)===tk?'today ':''}${p.total&&p.done===p.total?'full':''}">${!p.total?'—':fut?`0/${p.total}`:p.done===p.total?`★ ${p.done}/${p.total}`:`${p.done}/${p.total}`}</td>`;}).join('')}</tr>`).join('');
  const sum=S.kids.map(k=>`<div class="stat"><b>${weekStars(k.id)>=0?'+':''}${weekStars(k.id)}★</b><span>${esc(k.name)} · sao tuần này</span></div>`).join('');
  return `<div class="set"><h3>Tuần này</h3><table class="week"><tr><th></th>${head}</tr>${rows}</table>
    <p class="small muted">Ô đen ★ = hoàn thành hết việc trong ngày.</p><div class="stats" style="grid-template-columns:repeat(${S.kids.length},1fr)">${sum}</div></div>`;
}

let restOn=false,restLock=null,idleTimer=0;
function restTaskList(kidId,d){ // việc riêng + việc chung; chưa xong lên trước
  const own=sortT(tasksFor(kidId,d)).map(t=>({t,k:kidId})),sh=sortT(sharedFor(d)).map(t=>({t,k:'shared'}));
  return [...own,...sh].map(x=>({...x,done:isDone(d,x.t.id,x.k)})); // giữ nguyên thứ tự để dấu tick hiện tại chỗ
}
function renderRest(){
  if(!restOn)return;const n=new Date(),d=today();
  const cols=S.kids.map(k=>{const p=progress(k.id,d),list=restTaskList(k.id,d),all=p.total&&p.done===p.total;
    const body=list.map(x=>`<div class="rt${x.done?' done':''}" data-t="${x.t.id}" data-k="${x.k}"><div class="box">${x.done?'✓':''}</div><span>${esc(x.t.title)}${x.k==='shared'?' 🏠':''}${x.t.prio&&!x.done?' ★':''}</span></div>`).join('')+
      `<div class="more" data-done="0">${all?'🏆 Xong hết việc hôm nay!':''}</div>`;
    return `<div class="rcol"><div class="rk"><span class="ic">${k.icon}</span><b>${esc(k.name)}</b><span class="pill inv">${p.done}/${p.total}</span><span class="pill">★ ${S.stars[k.id]||0}</span></div>${body}</div>`;}).join('');
  $('rest').innerHTML=`<button class="x" data-act="restOff">✕ Thoát</button>
    <div class="rh"><div class="clock">${pad(n.getHours())}:${pad(n.getMinutes())}</div><div class="day"><b>${WD[n.getDay()]}</b><span>${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()} · 🏁 Vy Viên yêu thương</span></div></div>
    <div class="race">${raceHTML()}</div><div class="rcols">${cols}</div>
    <div class="rf"><span>Chạm vào việc để đánh dấu xong</span><span>${S.savedAt?'Cập nhật '+pad(new Date(S.savedAt).getHours())+':'+pad(new Date(S.savedAt).getMinutes()):''}</span></div>`;
  // Chữ to nhất mà cả hai cột vẫn vừa khung
  const rc=document.querySelector('#rest .rcols'),cl=[...document.querySelectorAll('#rest .rcol')],over=()=>cl.some(c=>c.scrollHeight>c.clientHeight+1);
  for(let s=30;s>=15;s--){rc.style.setProperty('--fs',s+'px');if(!over())break;}
  // Vẫn không vừa thì ẩn bớt; phần còn lại ghi “+N việc nữa”
  for(const col of cl){const more=col.querySelector('.more');if(!more)continue;let hid=0;
    const base=more.textContent,upd=()=>{more.textContent=[hid?`+ ${hid} việc nữa`:'',base].filter(Boolean).join(' · ');};
    // thiếu chỗ thì ẩn bớt việc ĐÃ XONG trước, rồi mới đến việc chưa xong ở cuối danh sách
    const rows=[...col.querySelectorAll('.rt')];const order=[...rows.filter(r=>r.classList.contains('done')).reverse(),...rows.filter(r=>!r.classList.contains('done')).reverse()];
    let doneHid=0;while(col.scrollHeight>col.clientHeight+1&&order.length>1){const r=order.shift();if(r.classList.contains('done'))doneHid++;else hid++;r.remove();
      more.textContent=[hid?`+ ${hid} việc nữa`:'',doneHid?`+ ${doneHid} việc đã xong ✓`:'',base].filter(Boolean).join(' · ');}}
}
window.addEventListener('resize',()=>{if(restOn)renderRest();});
async function restEnter(full){
  restOn=true;$('rest').hidden=false;renderRest();
  if(full){try{await document.documentElement.requestFullscreen?.({navigationUI:'hide'});}catch(_){}}
  try{restLock=await navigator.wakeLock?.request('screen');}catch(_){}
}
function restExit(){restOn=false;$('rest').hidden=true;try{restLock?.release();}catch(_){}restLock=null;
  if(document.fullscreenElement&&!S.fullAlways)document.exitFullscreen?.().catch(()=>{});armIdle();render();}
function armIdle(){clearTimeout(idleTimer);const m=+(S.idleRest??3)||0;if(!m||restOn)return;idleTimer=setTimeout(()=>{if(tab!=='set')restEnter(false);},m*60000);}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!restOn)armIdle();},true));
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&restOn){try{restLock=await navigator.wakeLock?.request('screen');}catch(_){}renderRest();}});

function render(){
  renderTop();renderRace();renderRest();
  $('main').innerHTML=({today:renderToday,week:renderWeek,board:renderBoard,shop:renderShop,rules:renderRules,set:renderSet})[tab]();
  $('tabs').innerHTML=TABS.map(([v,i,n])=>`<button data-tab="${v}" class="${tab===v?'on':''}"><span class="i">${i}</span>${n}</button>`).join('');
}

/* ================= Sự kiện ================= */
function askParent(){if(!S.pin||parentOK)return true;const p=prompt('Mã PIN của bố mẹ:');if(p===S.pin){parentOK=true;return true;}if(p!==null)alert('Sai mã PIN.');return false;}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-tab],[data-t],[data-f],[data-buy],[data-act],[data-adj],[data-del-task],[data-del-rw]');if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
  if(el.dataset.t){toggle(el.dataset.t,el.dataset.k);return;}
  if(el.matches('.seg button')){filter=el.dataset.f;render();return;}
  if(el.dataset.buy){const r=S.rewards.find(x=>x.id===el.dataset.buy),k=kid(el.dataset.k);if(!r||!k)return;
    if(!askParent())return;if(!confirm(`${k.name} đổi “${r.title}” với ${r.cost}★?`))return;
    S.stars[k.id]-=r.cost;addLog(k.id,-r.cost,'Đổi quà: '+r.title,'buy');save();render();alert(`Chúc mừng ${k.name}! 🎁`);return;}
  if(el.dataset.adj){const k=el.dataset.k,n=+el.dataset.adj;S.stars[k]=(S.stars[k]||0)+n;addLog(k,n,n>0?'Bố mẹ thưởng':'Bố mẹ trừ sao','adj');save();render();return;}
  if(el.dataset.delTask){if(confirm('Xóa nhiệm vụ này?')){S.tasks=S.tasks.filter(t=>t.id!==el.dataset.delTask);save();render();}return;}
  if(el.dataset.delRw){S.rewards=S.rewards.filter(r=>r.id!==el.dataset.delRw);save();render();return;}
  const a=el.dataset.act;
  if(a==='restOff'){restExit();return;}
  if(a==='unlock'){if($('pinIn').value===S.pin){parentOK=true;render();}else alert('Sai mã PIN.');}
  else if(a==='addTask'){S.tasks.push({id:uid(),title:'Việc mới',who:'both',session:'ca',stars:1,prio:false,deadline:'',days:[0,1,2,3,4,5,6]});save();render();window.scrollTo(0,document.body.scrollHeight);}
  else if(a==='addRw'){S.rewards.push({id:uid(),title:'Quà mới',cost:10});save();render();}
  else if(a==='setPin'){const v=$('pinSet').value.trim();if(!/^\d{4,6}$/.test(v)){alert('PIN gồm 4–6 chữ số.');return;}S.pin=v;parentOK=true;save();render();alert('Đã lưu PIN.');}
  else if(a==='clearPin'){S.pin='';save();render();}
  else if(a==='export'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`dua-sao-${dkey(new Date())}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
  else if(a==='import')$('impFile').click();
  else if(a==='resetToday'){if(confirm('Bỏ mọi đánh dấu hôm nay? (Sao đã cộng sẽ được trừ lại)')){const k=dkey(today()),m=S.done[k]||{};for(const key in m){const [tid,kd]=key.split('|'),t=S.tasks.find(x=>x.id===tid);if(!t)continue;for(const w of kd==='shared'?S.kids.map(x=>x.id):[kd]){S.stars[w]-=t.stars;addLog(w,-t.stars,'Bỏ đánh dấu: '+t.title,'task');}}delete S.done[k];save();render();}}
  else if(a==='newCode'){$('fbCode').value=newFamilyCode();}
  else if(a==='syncOn'){try{const cfg=parseFirebaseConfig($('fbCfg').value,$('fbDb').value),code=$('fbCode').value.trim();
      if(!/^[a-z0-9]{16,}$/.test(code))throw Error('Mã gia đình cần ít nhất 16 chữ thường hoặc số.');
      SY.cfg=cfg;SY.code=code;SY.on=true;SY.joined=false;syncSaveCfg();
      if(S&&!confirm('Bật đồng bộ? Nếu mã gia đình này đã có dữ liệu (từ máy khác), máy này sẽ dùng dữ liệu đó. Bản cũ trên máy này vẫn được giữ một bản dự phòng.')){SY.on=false;syncSaveCfg();return;}
      syncStart().then(render);render();}catch(e){alert(e.message);}}
  else if(a==='syncOff'){if(confirm('Tắt đồng bộ trên máy này? Dữ liệu vẫn giữ trên máy, chỉ không cập nhật với máy khác nữa.'))syncStop();}
  else if(a==='copyLink'){const v=$('shareLink').value;(navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>alert('Đã sao chép link. Gửi sang máy kia rồi mở bằng Chrome.')).catch(()=>{$('shareLink').select();alert('Bấm giữ ô link để sao chép.');});}
  else if(a==='resetAll'){if(confirm('Xóa toàn bộ dữ liệu và làm lại từ đầu? Không hoàn tác được.')){S=defaults();save();parentOK=false;render();}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='impFile'){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.kids||!o.tasks)throw 0;S=o;save();render();alert('Đã mở bản sao lưu.');}catch(_){alert('File sao lưu không hợp lệ.');}});return;}
  if(el.id==='idleSel'){S.idleRest=+el.value;save();armIdle();return;}
  if(el.id==='fullSel'){S.fullAlways=el.checked;save();return;}
  if(el.id==='rulesTa'){S.rules=el.value.split('\n').map(s=>s.trim()).filter(Boolean);save();return;}
  if(el.dataset.kid){const k=kid(el.dataset.kid);k[el.dataset.f]=el.value;save();renderRace();return;}
  if(el.dataset.task){const t=S.tasks.find(x=>x.id===el.dataset.task);if(!t)return;
    if(el.dataset.day!=null){const w=+el.dataset.day;t.days=el.checked?[...new Set([...t.days,w])]:t.days.filter(x=>x!==w);}
    else if(el.dataset.f==='prio')t.prio=el.checked;else if(el.dataset.f==='stars')t.stars=Math.max(0,Math.min(20,+el.value||0));else t[el.dataset.f]=el.value;
    save();renderRace();return;}
  if(el.dataset.rw){const r=S.rewards.find(x=>x.id===el.dataset.rw);if(!r)return;r[el.dataset.f]=el.dataset.f==='cost'?Math.max(1,+el.value||1):el.value;save();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pinIn')document.querySelector('[data-act="unlock"]')?.click();});

/* Tự làm mới khi sang ngày mới (kiểm tra mỗi phút, không có hiệu ứng để hợp màn e-ink) */
let lastDay=dkey(new Date());
function minuteTick(){const k=dkey(new Date());if(k!==lastDay){lastDay=k;render();}else{renderTop();renderRest();}
  setTimeout(minuteTick,60000-Date.now()%60000+200);} // canh đúng đầu mỗi phút để đồng hồ màn nghỉ chuẩn
setTimeout(minuteTick,60000-Date.now()%60000+200);
$('restBtn').onclick=()=>restEnter(true);
/* Mở từ biểu tượng màn hình chính (toàn màn hình) hoặc có ?nghi=1 thì vào thẳng màn hình nghỉ */
if(/[?&]nghi=1/.test(location.search))restEnter(false);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('dua-sao-sw.js').catch(()=>{});
render();armIdle();
if(SY.on)syncStart();
</script>
